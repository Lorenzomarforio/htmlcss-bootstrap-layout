<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-4">
        <h1 class="mb-4">HTML, CSS e Bootstrap</h1>

        <section class="mb-4">
            <h2>Una colonna</h2>
            <div class="row g-3">
                <div class="col-12"><div class="p-3 bg-primary text-white">12/12</div></div>
            </div>
        </section>

        <section class="mb-4">
            <h2>Due colonne</h2>
            <div class="row g-3">
                <div class="col-12 col-md-6"><div class="p-3 bg-secondary text-white">6/12</div></div>
                <div class="col-12 col-md-6"><div class="p-3 bg-secondary text-white">6/12</div></div>
            </div>
        </section>

        <section class="mb-4">
            <h2>Tre colonne</h2>
            <div class="row g-3">
                <div class="col-12 col-md-4"><div class="p-3 bg-success text-white">4/12</div></div>
                <div class="col-12 col-md-4"><div class="p-3 bg-success text-white">4/12</div></div>
                <div class="col-12 col-md-4"><div class="p-3 bg-success text-white">4/12</div></div>
            </div>
        </section>

        <section class="mb-4">
            <h2>Quattro colonne</h2>
            <div class="row g-3">
                <div class="col-12 col-sm-6 col-lg-3"><div class="p-3 bg-warning">3/12</div></div>
                <div class="col-12 col-sm-6 col-lg-3"><div class="p-3 bg-warning">3/12</div></div>
                <div class="col-12 col-sm-6 col-lg-3"><div class="p-3 bg-warning">3/12</div></div>
                <div class="col-12 col-sm-6 col-lg-3"><div class="p-3 bg-warning">3/12</div></div>
            </div>
        </section>
    </main>
</body>

</body>
</html>
